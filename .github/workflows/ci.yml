name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: moon run verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Moon compares the pull request with `main`, so it needs the full history.
        with:
          fetch-depth: 0

      # proto installs the tools in .prototools: Moon, Node, pnpm, Pkl, Python, Go, Rust, a JDK and Gradle. The JDK runs
      # Gradle and the Kotlin compiler.
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      # Gradle and its tests run on the JDK of JAVA_HOME. The runner sets it to its own JDK, so the job sets it to the JDK
      # of .prototools.
      - name: Use the JDK of .prototools
        run: echo "JAVA_HOME=$(java -XshowSettings:properties -version 2>&1 | awk -F'= ' '/java.home/ {print $2}')" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      # The WebMCP conformance tests run in Chromium. Install it with the system libraries that it needs.
      - run: pnpm --dir packages/cli exec playwright install --with-deps chromium

      - run: moon run verify
