name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: moon run verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # proto installs the tools in .prototools: Moon, Node, pnpm, Pkl, Python, Go and Rust.
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - run: pnpm install --frozen-lockfile

      # The WebMCP conformance tests run in Chromium. Install it with the system libraries that it needs.
      - run: pnpm --dir packages/cli exec playwright install --with-deps chromium

      - run: moon run verify
