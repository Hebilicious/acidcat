name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: moon run verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Moon compares the pull request with `main`, so it needs the full history.
        with:
          fetch-depth: 0

      # proto installs the tools in .prototools: Moon, Node, pnpm, Pkl, Python, Go and Rust.
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - run: pnpm install --frozen-lockfile

      # The builds of the Rust catalog library and of the Rust catalog of the air conditioner, with their dependencies.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            packages/catalog/rust
            examples/aircon/catalog/rust
          cache-workspace-crates: true

      # The build cache of Go. The Go modules have no dependencies, so there is no module cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('.prototools') }}-${{ hashFiles('packages/catalog/go/**', 'examples/aircon/catalog/go/**') }}
          restore-keys: go-build-${{ runner.os }}-${{ hashFiles('.prototools') }}-

      # The WebMCP conformance tests run in Chromium. The cache keeps the Chromium of the version of Playwright.
      - id: playwright
        run: echo "version=$(pnpm --dir packages/cli exec playwright --version)" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # When the cache has no Chromium, install it with the system libraries that it needs. The runner image already has
      # these libraries: the tests in Chromium pass on a runner that gets Chromium from the cache and installs nothing.
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --dir packages/cli exec playwright install --with-deps chromium

      - run: moon run verify
