name: AppFunctions

# Run acid-cat conform against the AppFunctions fixture on an emulator. The job runs when a change can change the result.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/appfunctions.yml"
      - ".prototools"
      - "packages/appfunctions/**"
      - "packages/core-kotlin/**"
      - "packages/cli/src/conform/**"
      - "packages/cli/conformance/**"
  pull_request:
    paths:
      - ".github/workflows/appfunctions.yml"
      - ".prototools"
      - "packages/appfunctions/**"
      - "packages/core-kotlin/**"
      - "packages/cli/src/conform/**"
      - "packages/cli/conformance/**"

permissions:
  contents: read

concurrency:
  group: appfunctions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conform:
    name: acid-cat conform --appfunctions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Moon compares the pull request with `main`, so it needs the full history.
        with:
          fetch-depth: 0

      # proto installs the tools in .prototools, with a JDK and Gradle. The JDK runs Gradle and the Kotlin compiler.
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      # Gradle runs on JAVA_HOME. The runner sets it to its own Java, so the job sets it to the Java of .prototools.
      - name: Use the Java of .prototools
        run: echo "JAVA_HOME=$(java -XshowSettings:properties -version 2>&1 | awk -F'= ' '/java.home/ {print $2}')" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      # The emulator needs KVM. The runner gives it only to the group kvm.
      - name: Give KVM to the job
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # AppFunctions needs Android 16 (API 36) or later. The emulator runs Android 17 (API 37) with the Google APIs.
      - name: Start an emulator
        timeout-minutes: 20
        run: |
          image="system-images;android-37.0;google_apis;x86_64"
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          # avdmanager and the emulator read the virtual devices from the same directory.
          export ANDROID_USER_HOME="$RUNNER_TEMP/android"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          yes | "$tools/sdkmanager" --licenses > /dev/null
          "$tools/sdkmanager" --install emulator platform-tools "$image" > /dev/null
          echo no | "$tools/avdmanager" create avd --name conform --package "$image" --device pixel_6
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          nohup "$ANDROID_HOME/emulator/emulator" -avd conform -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics \
            -accel on -gpu swiftshader_indirect -memory 4096 -cores 4 -partition-size 4096 -camera-back none -camera-front none > emulator.log 2>&1 &
          adb="$ANDROID_HOME/platform-tools/adb"
          # The boot has 15 minutes. A boot that does not end fails the step, and the next step prints the log.
          timeout 900 "$adb" wait-for-device
          timeout 900 sh -c "until [ \"\$('$adb' shell getprop sys.boot_completed | tr -d '\r')\" = 1 ]; do sleep 5; done"
          "$adb" shell getprop ro.build.version.sdk

      - name: Print the log of the emulator
        if: failure()
        run: tail -n 200 emulator.log

      - run: moon run appfunctions:conform

      - name: Print the log of the device
        if: failure()
        run: adb logcat -d -t 400 || true
