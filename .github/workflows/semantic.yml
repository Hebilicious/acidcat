name: Semantic

# The pull request title and body become the commit on main, because the repository allows squash merges only.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: semantic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic:
    name: semantic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Find the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$NUMBER" --json title,baseRefOid,headRefOid \
            --jq '"title=\(.title)\nbase=\(.baseRefOid)\nhead=\(.headRefOid)"' >> "$GITHUB_OUTPUT"

      - name: Check the pull request title
        env:
          TITLE: ${{ steps.pr.outputs.title }}
        run: printf '%s\n' "$TITLE" | scripts/check-semantic.sh

      - name: Check the commit titles
        env:
          BASE: ${{ steps.pr.outputs.base }}
          HEAD: ${{ steps.pr.outputs.head }}
        run: git log --format=%s "$BASE..$HEAD" | scripts/check-semantic.sh

      # Only node and pnpm, and only the packages of the workspace root, so that this job stays fast.
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          cache: false
      - run: proto install node && proto install pnpm
      - run: pnpm install --frozen-lockfile --filter acid-cat-workspace

      # release-please reads the squash commit that GitHub writes: the title and the body wrapped at 72 columns.
      # GitHub gives that exact text for each pull request.
      - name: Check that release-please can parse the squash commit
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          message=$(gh api graphql -F number="$NUMBER" -f owner="${GITHUB_REPOSITORY%/*}" -f name="${GITHUB_REPOSITORY#*/}" -f query='
            query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $number) {
                  viewerMergeHeadlineText(mergeType: SQUASH)
                  viewerMergeBodyText(mergeType: SQUASH)
                }
              }
            }' --jq '.data.repository.pullRequest | [.viewerMergeHeadlineText, .viewerMergeBodyText] | map(select(. != "")) | join("\n\n")')
          PR_BODY=$(gh pr view "$NUMBER" --json body --jq .body)
          export PR_BODY
          printf '%s\n' "$message" | node scripts/check-commit-message.ts
