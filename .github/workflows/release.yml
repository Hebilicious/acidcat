name: Release

# release-please keeps a release pull request open. It holds the next version and the changelog of each package with
# releasable commits since its last release: `feat`, `fix`, `perf`, `revert` and `deps`.
#
# Merge the release pull request to release. release-please then tags each released package and creates its GitHub
# release. Each tag starts the release workflow of its registry.
#
# release-please uses a token of the GitHub App `heb-release` (variable RELEASE_APP_CLIENT_ID, secret
# RELEASE_APP_PRIVATE_KEY), not GITHUB_TOKEN. GitHub starts no workflows for tags that GITHUB_TOKEN makes, and holds
# the checks of pull requests that GITHUB_TOKEN opens. With the token of the App, the release pull request has its
# checks, and the tags start the release workflows, as for any other pull request and tag.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app.outputs.token }}

      # The npm packages share one version, and one tag `npm/v<version>` publishes them all. release-please makes one
      # tag for each package, so this step makes the shared tag.
      - name: Tag the npm release
        if: steps.release.outputs['packages/cli--release_created']
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: npm/v${{ steps.release.outputs['packages/cli--version'] }}
          SHA: ${{ steps.release.outputs['packages/cli--sha'] }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA"
