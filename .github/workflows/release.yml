name: Release

# GitHub starts no workflows for tags that GITHUB_TOKEN makes, and holds the checks of pull requests that GITHUB_TOKEN
# opens.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app.outputs.token }}

      # release-please makes one tag for each package, and release-npm.yml starts from one tag for all of them. A run
      # can stop after it released packages/cli, so each run makes the npm tag when the release exists without it.
      - name: Tag the npm release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          tag_sha() {
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$1" --jq '.object.sha' 2>"$RUNNER_TEMP/error"; then return 0; fi
            if grep -q 'HTTP 404' "$RUNNER_TEMP/error"; then return 1; fi
            cat "$RUNNER_TEMP/error" >&2
            exit 1
          }
          version=$(gh api "repos/$GITHUB_REPOSITORY/contents/.release-please-manifest.json?ref=$GITHUB_SHA" --jq '.content' | base64 -d | jq -r '."packages/cli"')
          if ! sha=$(tag_sha "@acid-cat/cli@$version"); then echo "No release of @acid-cat/cli@$version."; exit 0; fi
          if tag_sha "npm/v$version" >/dev/null; then echo "npm/v$version exists."; exit 0; fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/npm/v$version" -f sha="$sha"
