name: Release crates.io (core)

# Publish acid-cat-core to crates.io at the version of the tag `crates-core/v<version>`.
# release.yml starts this workflow after a release. A tag pushed by hand on main also starts it.
# crates.io authenticates this workflow with trusted publishing, from the `crates-io` environment.
on:
  push:
    tags: ["crates-core/v*"]
  # Run it by hand on a tag to publish that release again.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - run: moon run core-rust:package

      - name: Check the version
        run: |
          test "$(grep -m1 '^version = ' packages/core-rust/Cargo.toml)" = "version = \"${GITHUB_REF_NAME#crates-core/v}\""

      # A release can publish acid-cat-catalog and acid-cat-core together. cargo publish builds the core with the
      # acid-cat-catalog of crates.io, so wait until the crates.io index has the version that the core requires.
      - name: Wait for acid-cat-catalog on crates.io
        run: |
          version="$(grep -oP '^acid-cat-catalog = \{ version = "\K[^"]+' packages/core-rust/Cargo.toml)"
          for attempt in $(seq 1 90); do
            if curl -fsS -A "acidcat-release (github.com/Hebilicious/acidcat)" https://index.crates.io/ac/id/acid-cat-catalog | grep -q "\"vers\":\"$version\""; then
              exit 0
            fi
            echo "acid-cat-catalog $version is not on crates.io yet (attempt $attempt)"
            sleep 20
          done
          echo "acid-cat-catalog $version is not on crates.io after 30 minutes"
          exit 1

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - run: cargo publish
        working-directory: packages/core-rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
