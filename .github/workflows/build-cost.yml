name: Build cost

on:
  pull_request:
    # The toolchain of the builds of vaporpress, and this workflow.
    paths:
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".prototools"
      - "vaporpress/src/**"
      - "vaporpress/package.json"
      - "site/vite.config.ts"
      - "site/package.json"
      - "site/moon.yml"
      - "benchmarks/apps/framework/**"
      - "benchmarks/moon.yml"
      - "benchmarks/src/build-cost.ts"
      - ".github/workflows/build-cost.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-cost-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: Measure main and this commit, job ${{ matrix.job }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      # Each build gets its own worktree and an empty store, so the install downloads every package. Odd jobs measure main
      # first, even jobs this commit first.
      - name: Measure
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          JOB: ${{ matrix.job }}
        run: |
          set -o pipefail
          out="$GITHUB_WORKSPACE/.tmp/build-cost"
          mkdir -p "$out"
          git worktree add "$RUNNER_TEMP/main" "$BASE"
          git worktree add "$RUNNER_TEMP/head" HEAD
          record() { printf '{"build":"%s","measure":"%s","value":%s}\n' "$1" "$2" "$3" >> "$out/job-$JOB.jsonl"; }
          seconds() {
            local start
            start=$(date +%s.%N)
            "$@" > /dev/null || return 1
            awk -v start="$start" -v end="$(date +%s.%N)" 'BEGIN { printf "%.2f", end - start }'
          }
          builds=(main head)
          if [ $((JOB % 2)) -eq 0 ]; then builds=(head main); fi
          for build in "${builds[@]}"; do
            cd "$RUNNER_TEMP/$build"
            elapsed=$(seconds pnpm install --frozen-lockfile --store-dir "$RUNNER_TEMP/store-$build")
            record "$build" "pnpm install, empty store (s)" "$elapsed"
            bytes=$(find . -name node_modules -type d -prune -print0 | du -scb --files0-from=- | tail -1 | cut -f1)
            record "$build" "node_modules (MB)" "$(awk -v bytes="$bytes" 'BEGIN { printf "%.2f", bytes / 1000000 }')"
            moon run site:fonts benchmarks:prepare > /dev/null
            # The build command of each app: `vp` where Vite+ is installed, `vite` before.
            fixture=vite
            if [ -x benchmarks/apps/framework/node_modules/.bin/vp ]; then fixture=vp; fi
            for run in 1 2 3; do
              elapsed=$(seconds pnpm --dir site run build)
              record "$build" "site build (s)" "$elapsed"
              elapsed=$(seconds pnpm --dir benchmarks/apps/framework exec "$fixture" build)
              record "$build" "fixture build (s)" "$elapsed"
            done
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-cost-${{ matrix.job }}
          path: .tmp/build-cost/

  summarize:
    name: Summarize
    needs: measure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4

      - run: proto install node

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-cost-*
          path: .tmp/build-cost

      - run: node benchmarks/src/build-cost.ts .tmp/build-cost
