name: Release Pkl

# pkg.pkl-lang.org redirects the package URI to the GitHub release with the name of the tag.
on:
  push:
    tags: ["acid-cat-catalog@*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: publish the Pkl package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - run: moon run catalog-pkl:test

      - name: Check the version
        run: |
          test "$(tr -d '[:space:]' < packages/catalog/pkl/version.txt)" = "${GITHUB_REF_NAME#acid-cat-catalog@}"

      - name: Attach the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "The Pkl package acid-cat-catalog."
          gh release upload "$GITHUB_REF_NAME" --clobber "packages/catalog/pkl/.out/$GITHUB_REF_NAME/"*
