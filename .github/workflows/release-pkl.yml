name: Release Pkl

# Publish the Pkl package at the version of the tag `acid-cat-catalog@<version>`.
# release.yml starts this workflow after a release. A tag pushed by hand on main also starts it.
# The package is a GitHub release with that name. pkg.pkl-lang.org redirects the package URI to it.
on:
  push:
    tags: ["acid-cat-catalog@*"]
  # Run it by hand on a tag to publish that release again.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: publish the Pkl package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - run: moon run catalog-pkl:test

      # The upload fails if the version in PklProject differs from the tag: .out/<tag>/ does not exist then.
      # release-please creates the release first. A tag pushed by hand has no release yet.
      - name: Attach the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "The Pkl package acid-cat-catalog."
          gh release upload "$GITHUB_REF_NAME" --clobber "packages/catalog/pkl/.out/$GITHUB_REF_NAME/"*
