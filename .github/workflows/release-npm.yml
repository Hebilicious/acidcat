name: Release npm

# Publish the npm packages at the version of the tag `npm/v<version>`.
# release.yml starts this workflow after a release. A tag pushed by hand on main also starts it.
# npm authenticates this workflow with trusted publishing, and adds provenance to each package.
on:
  push:
    tags: ["npm/v*"]
  # Run it by hand on a tag to publish that release again.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-npm
  cancel-in-progress: false

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - run: pnpm install --frozen-lockfile

      # The caches that CI writes on `main`: the Rust and Go builds, and Chromium. The release only reads them.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            packages/catalog/rust
            examples/aircon/catalog/rust
          cache-workspace-crates: true
          save-if: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('.prototools') }}-${{ hashFiles('packages/catalog/go/**', 'examples/aircon/catalog/go/**') }}
          restore-keys: go-build-${{ runner.os }}-${{ hashFiles('.prototools') }}-
      - id: playwright
        run: echo "version=$(pnpm --dir packages/cli exec playwright --version)" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # When the cache has no Chromium, install it with the system libraries that it needs. The runner image already has
      # these libraries.
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --dir packages/cli exec playwright install --with-deps chromium

      # `verify` also builds the packages, and tests them as they are installed from their tarballs.
      - run: moon run verify

      - run: node scripts/publish-npm.ts --version "${GITHUB_REF_NAME#npm/v}"
