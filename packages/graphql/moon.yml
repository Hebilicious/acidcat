language: "typescript"
layer: "library"

project:
  title: "@acid-cat/graphql"
  description: "The GraphQL binding, for any provider. npm package: @acid-cat/graphql."

toolchains:
  default: ["javascript", "node", "pnpm"]

tasks:
  test:
    description: "Test the GraphQL schema of a view, and the execution of each outcome."
    command: "node"
    args: ["--test", "test/"]
    inputs: ["src/**/*.ts", "test/**/*.ts", "/examples/*.acidcat.json"]

  typecheck:
    description: "Type-check the sources and tests."
    command: "tsc"
    args: ["-p", "."]
    inputs: ["src/**/*.ts", "test/**/*.ts", "tsconfig.json", "/tsconfig.base.json"]
