language: "typescript"
layer: "library"

project:
  title: "@acid-cat/core-effect"
  description: "Serve AcidCat capabilities, written fully in Effect. npm package: @acid-cat/core-effect."

toolchains:
  default: ["javascript", "node", "pnpm"]

tasks:
  build:
    description: "Bundle the package and write its declarations into dist/, for npm."
    command: "node"
    args: ["../../scripts/build-package.ts"]
    inputs: ["src/**/*", "package.json", "tsconfig.json", "tsconfig.build.json", "/tsconfig.base.json", "/scripts/build-package.ts"]
    outputs: ["dist/**/*"]

  test-programs:
    description: "Bundle each TypeScript program that the tests start as a process into .out/programs/. A bundle starts in less time than its source modules."
    command: "node"
    args: ["../../scripts/bundle-programs.ts", "test/fixture-cli.ts", "test/fixture-cli-flags.ts", "test/fixture-cli-commands.ts", "test/fixture-cli-repeated.ts", "test/fixture-cli-inherited.ts", "test/fixture-cli-ignoring-interruption.ts", "test/fixture-cli-remote.ts", "test/fixture-mcp-stdio.ts", "test/events-cli.ts", "test/events-cli-reserved.ts", "test/lamp-cli.ts"]
    inputs: ["src/**/*.ts", "test/**/*.ts", "/scripts/bundle-programs.ts", "/packages/spec-ts/src/**/*.ts", "/packages/catalog/typescript/src/**/*.ts", "/packages/mcp-handshake/src/**/*.ts"]
    outputs: [".out/programs/**/*"]

  test:
    deps: ["test-programs", "cli:browser"]
    description: "Test sessions, handles and the MCP, HTTP, CLI and WebMCP surfaces, with the test applications of the package and the air conditioner."
    command: "node"
    args: ["--test", "--test-timeout=$TEST_TIMEOUT_MS", "test/"]
    env:
      TEST_TIMEOUT_MS: "60000"
      NODE_COMPILE_CACHE: "node_modules/.cache/node-compile-cache"
    inputs: ["src/**/*.ts", "test/**/*.ts", "test/fixtures/*.json", "/packages/spec-ts/src/**/*.ts", "/packages/catalog/typescript/src/**/*.ts", "/packages/cli/src/**/*.ts", "/packages/cli/conformance/*.acidcat.json"]

  typecheck:
    description: "Type-check the sources and tests."
    command: "tsc"
    args: ["-p", "."]
    inputs: ["src/**/*.ts", "test/**/*.ts", "tsconfig.json", "/tsconfig.base.json"]
