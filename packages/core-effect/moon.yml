language: "typescript"
layer: "library"

project:
  title: "@acid-cat/core-effect"
  description: "Serve AcidCat capabilities, written fully in Effect. npm package: @acid-cat/core-effect."

toolchains:
  default: ["javascript", "node", "pnpm"]

tasks:
  build:
    description: "Bundle the package and write its declarations into dist/, for npm."
    command: "node"
    args: ["../../scripts/build-package.ts"]
    inputs: ["src/**/*", "package.json", "tsconfig.json", "tsconfig.build.json", "/tsconfig.base.json", "/scripts/build-package.ts"]
    outputs: ["dist/**/*"]

  test:
    deps: ["cli:browser"]
    description: "Test sessions and the MCP, HTTP, CLI and WebMCP bindings, with the test application and the air conditioner."
    command: "node"
    args: ["--test", "--test-timeout=60000", "test/"]
    inputs: ["src/**/*.ts", "test/**/*.ts", "examples/**/*.ts", "/examples/*.acidcat.json", "/packages/spec-ts/src/**/*.ts", "/packages/catalog/typescript/src/**/*.ts", "/packages/cli/src/**/*.ts"]

  typecheck:
    description: "Type-check the sources, tests and examples."
    command: "tsc"
    args: ["-p", "."]
    inputs: ["src/**/*.ts", "test/**/*.ts", "examples/**/*.ts", "tsconfig.json", "/tsconfig.base.json"]
