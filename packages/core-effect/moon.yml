language: "typescript"
layer: "library"

project:
  title: "@acid-cat/core-effect"
  description: "Serve AcidCat capabilities, written fully in Effect. npm package: @acid-cat/core-effect."

toolchains:
  default: ["javascript", "node", "pnpm"]

tasks:
  build:
    description: "Bundle the package and write its declarations into dist/, for npm."
    command: "node"
    args: ["../../scripts/build-package.ts"]
    inputs: ["src/**/*", "package.json", "tsconfig.json", "tsconfig.build.json", "/tsconfig.base.json", "/scripts/build-package.ts"]
    outputs: ["dist/**/*"]

  test:
    deps: ["cli:browser"]
    description: "Test sessions, handles and the MCP, HTTP, CLI and WebMCP bindings, with the test applications of the package and the air conditioner."
    command: "node"
    args: ["--test", "--test-timeout=60000", "test/"]
    # The tests start the fixtures in many Node.js processes. The compile cache lets each process reuse the compiled code.
    env:
      NODE_COMPILE_CACHE: "node_modules/.cache/node-compile-cache"
    inputs: ["src/**/*.ts", "test/**/*.ts", "/packages/spec-ts/src/**/*.ts", "/packages/catalog/typescript/src/**/*.ts", "/packages/cli/src/**/*.ts", "/packages/cli/conformance/*.acidcat.json"]
    # The conformance tests start servers, command lines and Chromium, and test the bindings at the same time. Two of
    # these tasks at the same time on a small CI runner make checks that must settle miss their deadline, so the tasks
    # that run them share the mutex "conform".
    options:
      mutex: "conform"

  typecheck:
    description: "Type-check the sources and tests."
    command: "tsc"
    args: ["-p", "."]
    inputs: ["src/**/*.ts", "test/**/*.ts", "tsconfig.json", "/tsconfig.base.json"]
