language: "python"
layer: "library"

project:
  title: "acid-cat-catalog"
  description: "Write a catalog in Python and render it in canonical form. Published to PyPI as acid-cat-catalog."

tasks:
  test:
    description: "Rebuild the example catalogs and the edge-case catalog, byte for byte."
    command: "python"
    args: ["-m", "unittest", "discover", "-s", "tests"]
    inputs: ["acid_cat_catalog/**/*.py", "examples/**/*.py", "tests/**/*.py", "/examples/*.acidcat.json", "examples/**/*.acidcat.json", "tests/fixtures/**/*"]
    toolchains: ["system"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"

  package:
    description: "Build the source distribution and the wheel into dist/, for PyPI."
    command: "uv"
    args: ["build", "--out-dir", "dist"]
    inputs: ["acid_cat_catalog/**/*.py", "pyproject.toml", "README.md", "LICENSE"]
    outputs: ["dist/**/*"]
    toolchains: ["system"]
