[project]
name = "acid-cat-catalog"
version = "0.1.0"
description = "Write an AcidCat catalog in Python and render it in canonical form."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hebilicious" }]
keywords = ["acidcat", "catalog"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/Hebilicious/acidcat/tree/main/packages/catalog/python#readme"
Repository = "https://github.com/Hebilicious/acidcat"
Issues = "https://github.com/Hebilicious/acidcat/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["acid_cat_catalog"]

[tool.hatch.build.targets.sdist]
include = ["acid_cat_catalog", "README.md", "LICENSE"]
