[project]
name = "acidcat-catalog"
version = "0.1.0"
description = "Write an AcidCat catalog in Python and render it in canonical form."
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["acidcat_catalog"]
