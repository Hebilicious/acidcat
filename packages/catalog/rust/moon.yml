language: "rust"
layer: "library"

project:
  title: "acid-cat-catalog"
  description: "Write a catalog in Rust and render it in canonical form. Published to crates.io as acid-cat-catalog."

tasks:
  test:
    description: "Rebuild the example catalogs and the edge-case catalog, byte for byte."
    command: "cargo"
    args: ["test"]
    inputs: ["src/**/*", "examples/**/*", "tests/**/*", "Cargo.toml", "Cargo.lock", "/examples/*.acidcat.json"]
    toolchains: ["system"]

  package:
    description: "Package the crate, and build it from the package, for crates.io."
    command: "cargo"
    args: ["package", "--allow-dirty"]
    inputs: ["src/**/*", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]
    toolchains: ["system"]
