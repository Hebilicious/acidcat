language: "go"
layer: "library"

project:
  title: "github.com/Hebilicious/acidcat/packages/catalog/go"
  description: "Write a catalog in Go and render it in canonical form. Published as the Go module github.com/Hebilicious/acidcat/packages/catalog/go."

tasks:
  test:
    description: "Rebuild the example catalogs and the edge-case catalog, byte for byte."
    command: "go"
    args: ["test", "./..."]
    inputs: ["**/*.go", "go.mod", "examples/**/*.acidcat.json", "testdata/**/*"]
    toolchains: ["system"]
