language: "go"
layer: "library"

project:
  title: "github.com/Hebilicious/acidcat/packages/catalog/go"
  description: "Write a catalog in Go and render it in canonical form. Published as the Go module github.com/Hebilicious/acidcat/packages/catalog/go."

tasks:
  test:
    description: "Rebuild the air-conditioner catalog and the canonical fixture, byte for byte."
    command: "go"
    args: ["test", "./..."]
    inputs: ["**/*.go", "go.mod", "/examples/*.acidcat.json", "/packages/catalog/fixtures/**/*"]
    toolchains: ["system"]
