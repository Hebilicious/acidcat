language: "unknown"
layer: "library"

project:
  title: "acid-cat-catalog (Pkl)"
  description: "Write a catalog in Pkl. Published as the Pkl package package://pkg.pkl-lang.org/github.com/Hebilicious/acidcat/acid-cat-catalog."

tasks:
  test:
    description: "Package the module, then evaluate the greenhouse example. Packaging evaluates every module in the package."
    script: "pkl project package --skip-publish-check && pkl eval examples/greenhouse.pkl > /dev/null"
    inputs: ["*.pkl", "examples/*.pkl", "PklProject", "version.txt", "LICENSE"]
    outputs: [".out/**/*"]
    toolchains: ["system"]
