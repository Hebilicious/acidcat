language: "unknown"
layer: "library"

project:
  title: "acid-cat-catalog (Pkl)"
  description: "Write a catalog in Pkl. Published as the Pkl package package://pkg.pkl-lang.org/github.com/Hebilicious/acidcat/acid-cat-catalog."

tasks:
  test:
    description: "Package the module, evaluate the greenhouse example, and check that each catalog in rejected/ fails with the error that its first line names. Packaging evaluates every module in the package."
    script: |
      pkl project package --skip-publish-check && pkl eval examples/greenhouse.pkl > /dev/null || exit 1
      for file in rejected/*.pkl; do
        expected=$(sed -n '1s#^// pkl eval fails with: ##p' "$file")
        [ -n "$expected" ] || { echo "$file does not name its error on its first line"; exit 1; }
        pkl eval "$file" 2>&1 | grep -qF -- "$expected" || { echo "$file does not fail with: $expected"; exit 1; }
      done
    inputs: ["*.pkl", "examples/*.pkl", "rejected/*.pkl", "PklProject", "version.txt", "LICENSE"]
    outputs: [".out/**/*"]
    toolchains: ["system"]
