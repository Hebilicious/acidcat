[package]
name = "acid-cat-core"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
description = "Serve AcidCat capabilities and events in Rust, through the MCP, HTTP and CLI bindings."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Hebilicious/acidcat"
homepage = "https://github.com/Hebilicious/acidcat/tree/main/packages/core-rust#readme"
keywords = ["acidcat", "mcp", "json-schema", "cli"]
categories = ["network-programming", "command-line-interface"]
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
acid-cat-catalog = { version = "0.2.2", path = "../catalog/rust" }
base64 = "0.22.1"
bytes = "1.11.1"
futures = "0.3.32"
hmac = "0.12.1"
http = "1.5.0"
http-body = "1.0.1"
http-body-util = "0.1.5"
humantime = "2.4.0"
hyper = { version = "1.11.1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.20", features = ["server-auto", "tokio"] }
jsonschema = { version = "0.58.6", default-features = false }
rand = "0.9.4"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
schemars = "1.2.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
uuid = { version = "1.23.1", features = ["v4"] }
webpki-roots = "1.0.9"

[dev-dependencies]
async-stream = "0.3"
