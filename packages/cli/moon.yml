language: "typescript"
layer: "tool"

project:
  title: "@acid-cat/cli"
  description: "The acid-cat command: check, format and view catalogs. Published to npm as @acid-cat/cli."

toolchains:
  default: ["javascript", "node", "pnpm"]

tasks:
  test:
    description: "Test canonical form, views, bundling and the catalog rules."
    command: "node"
    args: ["--test", "test/"]
    inputs: ["src/**/*.ts", "test/**/*.ts", "/schemas/**/*.json", "/examples/*.acidcat.json"]
