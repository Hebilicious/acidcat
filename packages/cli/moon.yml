language: "typescript"
layer: "library"

project:
  title: "@acid-cat/cli"
  description: "The acid-cat command: check, format and view catalogs. Published to npm as @acid-cat/cli."

toolchains:
  default: ["javascript", "node", "pnpm"]

tasks:
  build:
    description: "Bundle the package and write its declarations into dist/, for npm."
    command: "node"
    args: ["../../scripts/build-package.ts"]
    inputs: ["src/**/*", "package.json", "tsconfig.json", "tsconfig.build.json", "/tsconfig.base.json", "/scripts/build-package.ts", "/schemas/catalog.schema.json"]
    outputs: ["dist/**/*"]

  test:
    description: "Test canonical form, views, bundling and the catalog rules."
    command: "node"
    args: ["--test", "test/"]
    inputs: ["src/**/*.ts", "test/**/*.ts", "/schemas/**/*.json", "/examples/*.acidcat.json", "/packages/catalog/typescript/src/**/*.ts"]

  typecheck:
    description: "Type-check the sources, tests and examples."
    command: "tsc"
    args: ["-p", "."]
    inputs: ["src/**/*.ts", "test/**/*.ts", "examples/**/*.ts", "tsconfig.json", "/tsconfig.base.json"]

  browser:
    description: "Install Chromium for `acid-cat conform --webmcp`. It does nothing if Chromium is installed."
    command: "playwright"
    args: ["install", "chromium"]
    options:
      cache: false
