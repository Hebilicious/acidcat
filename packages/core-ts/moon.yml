language: "typescript"
layer: "library"

project:
  title: "@acid-cat/core-ts"
  description: "Serve AcidCat capabilities in plain TypeScript, with no Effect dependency. npm package: @acid-cat/core-ts."

toolchains:
  default: ["javascript", "node", "pnpm"]

tasks:
  build:
    description: "Bundle the package and write its declarations into dist/, for npm."
    command: "node"
    args: ["../../scripts/build-package.ts"]
    inputs: ["src/**/*", "package.json", "tsconfig.json", "tsconfig.build.json", "/tsconfig.base.json", "/scripts/build-package.ts"]
    outputs: ["dist/**/*"]

  test:
    deps: ["cli:browser"]
    description: "Test sessions, handles and the MCP, HTTP, CLI and WebMCP bindings, with the test application, the kettle and the air conditioner. WebMCP also runs in Chromium."
    command: "node"
    args: ["--test", "--test-timeout=60000", "test/"]
    inputs: ["src/**/*.ts", "test/**/*.ts", "/packages/spec-ts/src/**/*.ts", "/packages/catalog/typescript/src/**/*.ts", "/packages/cli/src/**/*.ts", "/packages/cli/conformance/*.acidcat.json"]
    # The conformance tests start servers, command lines and Chromium. Two of them at the same time on a small CI runner
    # take longer than the time of a test, so the tasks that run them share the mutex "conform".
    options:
      mutex: "conform"

  typecheck:
    description: "Type-check the sources and tests."
    command: "tsc"
    args: ["-p", "."]
    inputs: ["src/**/*.ts", "test/**/*.ts", "tsconfig.json", "/tsconfig.base.json"]
