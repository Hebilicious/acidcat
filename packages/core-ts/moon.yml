language: "typescript"
layer: "library"

project:
  title: "@acid-cat/core-ts"
  description: "Serve AcidCat capabilities and events in plain TypeScript, with no Effect dependency. npm package: @acid-cat/core-ts."

toolchains:
  default: ["javascript", "node", "pnpm"]

tasks:
  build:
    description: "Bundle the package and write its declarations into dist/, for npm."
    command: "node"
    args: ["../../scripts/build-package.ts"]
    inputs: ["src/**/*", "package.json", "tsconfig.json", "tsconfig.build.json", "/tsconfig.base.json", "/scripts/build-package.ts"]
    outputs: ["dist/**/*"]

  test:
    deps: ["cli:browser"]
    description: "Test sessions, handles, event handles and the MCP, HTTP, CLI and WebMCP bindings, with the test application, the kettle, the sensors and the air conditioner. WebMCP also runs in Chromium."
    command: "node"
    args: ["--test", "--test-timeout=60000", "test/"]
    env:
      NODE_COMPILE_CACHE: "node_modules/.cache/node-compile-cache"
    options:
      mutex: "node-test-processes"
    inputs: ["src/**/*.ts", "test/**/*.ts", "test/fixtures/*.json", "/packages/spec-ts/src/**/*.ts", "/packages/catalog/typescript/src/**/*.ts", "/packages/cli/src/**/*.ts", "/packages/cli/conformance/*.acidcat.json"]

  typecheck:
    description: "Type-check the sources and tests."
    command: "tsc"
    args: ["-p", "."]
    inputs: ["src/**/*.ts", "test/**/*.ts", "tsconfig.json", "/tsconfig.base.json"]
