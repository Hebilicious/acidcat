packages:
  - "packages/spec-ts"
  - "packages/mcp-handshake"
  - "packages/cli"
  - "packages/core-effect"
  - "packages/core-ts"
  - "packages/catalog/typescript"
  - "examples/aircon"
  - "model"
  - "site"
  - "site-framework"

allowBuilds:
  esbuild: true
  protobufjs: false
  workerd: false

# `effect` and its platform packages depend on each other with `^` ranges. Give them `^` ranges too, so that the
# published packages do not hold `effect` back while a platform package moves on. The lockfile keeps the installs exact.
catalog:
  "@conventional-commits/parser": 0.4.1
  "@modelcontextprotocol/client": 2.4.0
  "@effect/platform-node": ^4.1.3
  "@effect/platform-node-shared": ^4.1.3
  "@fontsource/monaspace-argon": 5.3.0
  "@fontsource/monaspace-krypton": 5.3.0
  "@fontsource/monaspace-neon": 5.3.0
  "@fontsource/monaspace-radon": 5.3.0
  "@fontsource/monaspace-xenon": 5.3.0
  "@hebilicious/cssforge": 0.10.1
  "@informalsystems/quint": 0.33.1
  "@elysiajs/node": 1.4.5
  "@pothos/core": 4.17.0
  shiki: 4.6.0
  "@types/node": 26.6.6
  "@types/subset-font": 2.3.0
  "@types/three": 0.187.0
  "@types/hast": 3.0.5
  "@types/mdast": 4.0.4
  "@types/ws": 8.18.2
  axe-core: 4.14.0
  capnweb: 0.12.0
  cf: 1.0.0-rc.4
  effect: ^4.1.3
  esbuild: 0.28.2
  elysia: 1.4.30
  fast-check: 4.10.2
  graphql: 17.1.0
  hast-util-from-html: 2.0.3
  lighthouse: 13.6.0
  hast-util-to-mdast: 10.1.2
  mdast-util-gfm: 3.1.0
  mdast-util-to-markdown: 2.2.2
  graphql-sse: 2.6.3
  graphql-ws: 6.4.1
  graphql-yoga: 6.0.1
  oxlint: 1.93.0
  oxlint-tsgolint: 7.0.2006
  playwright: 1.65.0
  postcss: 8.5.33
  rolldown: 1.3.1
  sharp: 0.35.5
  subset-font: 2.9.0
  three: 0.187.0
  typescript: 7.0.2
  vite: 8.3.8
  yaml: 2.9.1
  vitepress: 2.0.0-alpha.21
  vue: 3.5.45
  ws: 8.22.2
  zod: 4.6.7

catalogs:
