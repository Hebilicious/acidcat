packages:
  - "packages/spec-ts"
  - "packages/cli"
  - "packages/core-effect"
  - "packages/core-ts"
  - "packages/catalog/typescript"
  - "examples/aircon"

# Every dependency is pinned once, here. Packages name `catalog:` and never a version.
allowBuilds:
  esbuild: true

# `effect`, `@effect/platform-node` and `@effect/platform-node-shared` have one version. `@acid-cat/cli` depends on all
# three, so that the versions it brings agree, and no peer dependency of `effect` is unmet.
catalog:
  "@modelcontextprotocol/client": 2.3.1
  "@effect/platform-node": 4.0.6
  "@effect/platform-node-shared": 4.0.6
  "@pothos/core": 4.15.1
  "@types/node": 26.6.5
  capnweb: 0.12.0
  effect: 4.0.6
  esbuild: 0.28.2
  elysia: 1.4.30
  fast-check: 4.10.2
  graphql: 17.0.2
  graphql-yoga: 5.24.4
  playwright: 1.64.0
  rolldown: 1.2.13
  typescript: 7.0.2
  zod: 4.6.7

# The ranges that published packages accept for their peer dependencies. The packages test against `catalog`.
catalogs:
  peers:
    "@effect/platform-node": ^4.0.0
    effect: ^4.0.0
    playwright: ^1.64.0

minimumReleaseAgeExclude:
  - zod@4.6.7
