packages:
  - "packages/spec-ts"
  - "packages/mcp-handshake"
  - "packages/cli"
  - "packages/core-effect"
  - "packages/core-ts"
  - "packages/catalog/typescript"
  - "examples/aircon"

# Every dependency is pinned once, here. Packages name `catalog:` and never a version.
allowBuilds:
  esbuild: true

# `effect` and its platform packages depend on each other with `^` ranges. Give them `^` ranges too, so that the
# published packages do not hold `effect` back while a platform package moves on. The lockfile keeps the installs exact.
catalog:
  "@modelcontextprotocol/client": 2.3.1
  "@effect/platform-node": ^4.1.1
  "@effect/platform-node-shared": ^4.1.1
  "@pothos/core": 4.15.1
  "@types/node": 26.6.5
  capnweb: 0.12.0
  effect: ^4.1.1
  esbuild: 0.28.2
  elysia: 1.4.30
  fast-check: 4.10.2
  graphql: 17.0.2
  graphql-yoga: 5.24.4
  oxlint: 1.89.0
  oxlint-tsgolint: 7.0.2005
  playwright: 1.64.0
  rolldown: 1.2.13
  typescript: 7.0.2
  zod: 4.6.7

# The ranges that published packages accept for their peer dependencies. The packages test against `catalog`.
catalogs:
  peers:
    "@effect/platform-node": ^4.0.0
    effect: ^4.0.0
    playwright: ^1.64.0

minimumReleaseAgeExclude:
  - zod@4.6.7
