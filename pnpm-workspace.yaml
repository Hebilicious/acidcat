    "@vitejs/plugin-vue": 6.0.11
    "@vue/compiler-sfc": 3.6.0-rc.16
    "@vue/compiler-vapor": 3.6.0-rc.16
    "@vue/server-renderer": 3.6.0-rc.16
    satteri: 0.11.7
    vue: 3.6.0-rc.16
    vue-router: 5.5.1
  peers:
    "@effect/platform-node": ^4.0.0
    effect: ^4.0.0
    playwright: ^1.64.0

minimumReleaseAgeExclude:
  - zod@4.6.7
  - cf@1.0.0-rc.4
