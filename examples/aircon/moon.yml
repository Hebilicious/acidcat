language: "typescript"
layer: "application"

project:
  title: "@acid-cat/example-aircon"
  description: "An air conditioner, described once and served to every surface: its catalog in five languages, its application on three cores with a command line each, a web page with WebMCP tools on each TypeScript core, and APIs built on it. Not published."

toolchains:
  default: ["javascript", "node", "pnpm"]

tasks:
  schema:
    description: "Write the schema of the GraphQL API to apis/schema.graphql."
    command: "node"
    args: ["apis/write-schema.ts"]
    inputs: ["apis/graphql.ts", "apis/shared.ts", "apis/write-schema.ts", "core-ts/**/*.ts"]
    outputs: ["apis/schema.graphql"]
    options:
      runInCI: false

  test-rust:
    description: "Build the program of the air conditioner on the Rust core, and run its tests: the session, the events and the state. The tests of the command line and of the MCP server start this program."
    script: "cd core-rust && cargo build --quiet && cargo test --quiet"
    inputs:
      - "core-rust/src/**/*.rs"
      - "core-rust/Cargo.toml"
      - "core-rust/Cargo.lock"
      - "/packages/catalog/rust/src/**/*.rs"
      - "/packages/core-rust/src/**/*.rs"
      - "/packages/core-rust/Cargo.toml"
    toolchains: ["system"]

  test:
    deps: ["test-rust", "cli:browser"]
    description: "Write the catalog in each language, run the application on each core and its command line, open the web page of each TypeScript core in Chromium with a test WebMCP host, and call each API."
    command: "node"
    args: ["--test", "--test-timeout=60000", "test/"]
    # The tests start the command lines and the MCP servers in Node.js processes. The compile cache lets each process
    # reuse the compiled code.
    env:
      NODE_COMPILE_CACHE: "node_modules/.cache/node-compile-cache"
    inputs:
      - "catalog/**/*"
      - "core-ts/**/*.ts"
      - "core-effect/**/*.ts"
      - "core-rust/src/**/*.rs"
      - "core-rust/Cargo.toml"
      - "core-rust/Cargo.lock"
      - "apis/**/*"
      - "web/**/*.ts"
      - "test/**/*.ts"
      - "/packages/catalog/typescript/src/**/*.ts"
      - "/packages/catalog/python/acid_cat_catalog/**/*.py"
      - "/packages/catalog/go/**/*.go"
      - "/packages/catalog/rust/src/**/*.rs"
      - "/packages/core-rust/src/**/*.rs"
      - "/packages/core-ts/src/**/*.ts"
      - "/packages/core-effect/src/**/*.ts"
      - "/packages/spec-ts/src/**/*.ts"
      - "/packages/cli/src/**/*.ts"

  typecheck:
    description: "Type-check the sources and tests."
    command: "tsc"
    args: ["-p", "."]
    inputs:
      - "catalog/**/*.ts"
      - "core-ts/**/*.ts"
      - "core-effect/**/*.ts"
      - "apis/**/*.ts"
      - "web/**/*.ts"
      - "test/**/*.ts"
      - "tsconfig.json"
      - "/tsconfig.base.json"
      - "/packages/catalog/typescript/src/**/*.ts"
      - "/packages/core-ts/src/**/*.ts"
      - "/packages/core-effect/src/**/*.ts"
      - "/packages/spec-ts/src/**/*.ts"
