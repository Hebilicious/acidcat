# An air conditioner that can be controlled over Wi-Fi, described once and served to every surface.
acidcat: "0.1"
title: Living-room air conditioner
description: Control and monitor one split-unit air conditioner on the home network.

targets:
  app:
    description: The phone, desktop and web apps that people use.
    bindings: [typescript, acme:swift, acme:kotlin]
  taskbar:
    description: A desktop taskbar widget showing the status and a power toggle.
    bindings: [typescript]
  cli:
    bindings: [cli]
  mcp:
    description: Agents, through an MCP server.
    bindings: [mcp]
  api:
    description: Home-automation systems and scripts.
    bindings: [http, graphql]

capabilities:
  aircon.status.get:
    description: Read the unit's power, mode, fan speed, target temperature and room temperature.
    audience: [app, taskbar, cli, mcp, api]
    readOnly: true
    output:
      $ref: "#/$defs/Status"
      $defs:
        Status:
          title: Status
          type: object
          required: [power, mode, fan, targetCelsius, roomCelsius]
          properties:
            power: { type: boolean }
            mode: { enum: [cool, heat, dry, fan, auto] }
            fan: { enum: [auto, low, medium, high] }
            targetCelsius: { type: number }
            roomCelsius: { type: number }
    state:
      title: Status
      description: The same status, published whenever it changes.
      type: object
      required: [power, mode, fan, targetCelsius, roomCelsius]
      properties:
        power: { type: boolean }
        mode: { enum: [cool, heat, dry, fan, auto] }
        fan: { enum: [auto, low, medium, high] }
        targetCelsius: { type: number }
        roomCelsius: { type: number }
    failures:
      Offline:
        type: object
        properties:
          since: { type: string, format: date-time }

  aircon.power.set:
    description: Turn the unit on or off.
    audience: [app, taskbar, cli, mcp, api]
    input:
      type: object
      required: [on]
      properties:
        on: { type: boolean }
    failures:
      Offline: { type: object }

  aircon.mode.set:
    description: Choose how the unit runs.
    audience: [app, cli, mcp, api]
    input:
      type: object
      required: [mode]
      properties:
        mode: { enum: [cool, heat, dry, fan, auto] }
    failures:
      Offline: { type: object }
      PoweredOff:
        type: object
        description: The unit must be on before its mode can change.

  aircon.temperature.set:
    description: Set the target temperature in degrees Celsius.
    audience: [app, cli, mcp, api]
    input:
      type: object
      required: [celsius]
      properties:
        celsius: { type: number, minimum: 16, maximum: 31 }
    failures:
      Offline: { type: object }

  aircon.fan.set:
    description: Set the fan speed.
    audience: [app, cli, mcp, api]
    input:
      type: object
      required: [speed]
      properties:
        speed: { enum: [auto, low, medium, high] }
    failures:
      Offline: { type: object }

  aircon.firmware.update:
    description: Install the latest firmware. The unit restarts and is offline for about a minute.
    audience: [app]
    failures:
      Offline: { type: object }
      UpToDate:
        type: object
        properties:
          version: { type: string }
