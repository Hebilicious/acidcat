projects:
  acidcat: "."
  toolchain: "packages/toolchain"
  catalog-typescript: "packages/catalog/typescript"
  catalog-python: "packages/catalog/python"
  catalog-go: "packages/catalog/go"
  catalog-rust: "packages/catalog/rust"

defaultProject: "acidcat"
telemetry: false
versionConstraint: ">=2.5.6 <2.6.0"

vcs:
  defaultBranch: "main"

hasher:
  walkStrategy: "glob"
  ignorePatterns:
    - "**/node_modules/**"
    - "packages/catalog/rust/target/**"

pipeline:
  installDependencies:
    - "javascript"
