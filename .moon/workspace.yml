projects:
  acid-cat: "."
  spec-ts: "packages/spec-ts"
  cli: "packages/cli"
  core-effect: "packages/core-effect"
  core-ts: "packages/core-ts"
  catalog-typescript: "packages/catalog/typescript"
  example-apis: "examples/apis"
  catalog-python: "packages/catalog/python"
  catalog-go: "packages/catalog/go"
  catalog-rust: "packages/catalog/rust"

defaultProject: "acid-cat"
telemetry: false
versionConstraint: ">=2.5.6 <2.6.0"

vcs:
  defaultBranch: "main"

hasher:
  walkStrategy: "glob"
  ignorePatterns:
    - "**/node_modules/**"
    - "packages/catalog/rust/target/**"

pipeline:
  installDependencies:
    - "javascript"
