language: "typescript"
layer: "application"

project:
  title: "AcidCat site"
  description: "The homepage and the documentation of AcidCat, built with VitePress."

toolchains:
  default: ["javascript", "node", "pnpm"]

tasks:
  tokens:
    description: "Write the design tokens from cssforge.config.ts into .cssforge/output.css."
    command: "cssforge"
    args: ["--mode", "css"]
    inputs: ["cssforge.config.ts"]
    outputs: [".cssforge/output.css"]

  tokens-watch:
    description: "Write the design tokens again each time cssforge.config.ts changes."
    command: "cssforge"
    args: ["--mode", "css", "--watch"]
    preset: "server"

  fonts:
    description: "Write the core and the rest of each font face, and their @font-face rules, into .fonts/. Both builds read them."
    command: "node"
    args: ["scripts/write-fonts.ts"]
    inputs: ["scripts/write-fonts.ts", "src/lib/fonts.ts", "src/lib/font-faces.ts", "package.json"]
    outputs: [".fonts/**/*"]

  dev:
    deps: ["tokens-watch", "fonts"]
    description: "Serve the site with live reload at http://localhost:5173, and write the design tokens on each change."
    command: "vitepress"
    args: ["dev"]
    preset: "server"

  tokens-check:
    description: "Check that .cssforge/output.css matches cssforge.config.ts."
    script: "cssforge --mode css --css .tmp-tokens.css >/dev/null && diff -q .tmp-tokens.css .cssforge/output.css; status=$?; rm -f .tmp-tokens.css; exit $status"
    inputs: ["cssforge.config.ts", ".cssforge/output.css"]

  build:
    deps: ["fonts"]
    description: "Build the static site into dist/."
    command: "vitepress"
    args: ["build"]
    inputs:
      - "src/**/*"
      - "content/**/*"
      - "public/**/*"
      - ".vitepress/config.ts"
      - ".vitepress/theme/**/*"
      - "cssforge.config.ts"
      - "package.json"
      - "/spec/**/*.md"
      - "/release-please-config.json"
      - "/.release-please-manifest.json"
      - "/packages/README.md"
      - "/packages/**/package.json"
      - "/packages/**/Cargo.toml"
      - "/packages/**/pyproject.toml"
      - "/packages/core-*/README.md"
      - "/examples/**/*"
      - "/skills/**/*"
      - "/packages/core-ts/src/**/*.ts"
      - "/packages/spec-ts/src/**/*.ts"
      - "/packages/mcp-handshake/src/**/*.ts"
      - "/packages/catalog/typescript/src/**/*.ts"
    outputs: ["dist/**/*"]

  build-framework:
    deps: ["fonts"]
    description: "Build the docs, the examples and the specification with vaporpress into .out/framework/. VitePress builds the deployed site until every part has moved."
    command: "vite"
    args: ["build", "--config", "framework.config.ts"]
    inputs:
      - "src/**/*"
      - "content/**/*"
      - "public/**/*"
      - "framework.config.ts"
      - "package.json"
      - "/spec/**/*.md"
      - "/examples/**/*"
      - "/vaporpress/src/**/*"
    outputs: [".out/framework/**/*"]

  catalog:
    description: "Write the catalog of the AcidCat app of the site, site.acidcat.json, from its code."
    command: "node"
    args: ["src/lib/agent/write-catalog.ts"]
    inputs: ["src/lib/agent/app.ts", "src/lib/agent/content.ts"]
    outputs: ["site.acidcat.json"]
    options:
      runInCI: false

  deploy:
    deps: ["build"]
    description: "Bundle the Worker, and deploy it with dist/ as its assets, with the cf command. Set CLOUDFLARE_ACCOUNT_ID first."
    script: "node scripts/worker-output.ts && cf deploy --prebuilt"
    options:
      cache: false
      runInCI: false

  preview:
    deps: ["build"]
    description: "Bundle the Worker, and deploy it with dist/ as a Worker Preview named after the Git branch. Production does not change. Set CLOUDFLARE_ACCOUNT_ID first."
    script: "node scripts/worker-output.ts --preview && cf previews deploy --prebuilt"
    options:
      cache: false
      runInCI: false

  advertised:
    description: "Fetch each URL that llms.txt, the well-known documents and the Link header list, from the origin that follows --, and fail when one does not answer 200 with the type that it needs."
    command: "node"
    args: ["scripts/check-advertised.ts"]
    options:
      cache: false
      runInCI: false

  test:
    deps: ["build", "build-framework", "tokens-check"]
    description: "Test the geometry of the art, render the homepage in Chromium at desktop and phone widths, and call the AcidCat app of the site through the Worker, MCP, HTTP and WebMCP."
    command: "node"
    args: ["--test", "test/"]
    inputs: ["src/**/*", "content/**/*", ".vitepress/**/*", "framework.config.ts", "test/**/*.ts", "worker/**/*.ts", "site.acidcat.json", "/skills/**/*", "/vaporpress/src/**/*"]

  typecheck:
    description: "Type-check the art geometry, the tests and the configuration."
    command: "tsc"
    args: ["-p", "."]
    inputs: ["src/lib/**/*.ts", "src/app/**/*.ts", "test/**/*.ts", "worker/**/*.ts", "scripts/**/*.ts", ".vitepress/**/*.ts", "content/**/*.ts", "cssforge.config.ts", "cloudflare.config.ts", "framework.config.ts", "tsconfig.json", "/tsconfig.base.json"]

  lighthouse:
    deps: ["build"]
    description: "Serve dist/ with compression, run Lighthouse on mobile on the homepage and the quick start several times, and fail when a median score or a pass-or-fail audit misses its budget. The workflow lighthouse.yml runs it on GitHub's runners."
    command: "node"
    args: ["scripts/lighthouse.ts"]
    options:
      cache: false
