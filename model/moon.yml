language: "typescript"
layer: "automation"

project:
  title: "@acid-cat/model"
  description: "The formal models of the rules that each core follows, in Quint, and the generator of the data and the cases that each core uses."

toolchains:
  default: ["javascript", "node", "pnpm"]

tasks:
  test:
    description: "Run the tests of the models, and type-check the modules of the properties."
    script: "quint test cli-output.qnt && quint typecheck cli-output-properties.qnt && quint typecheck cli-output-cases.qnt"
    inputs: ["*.qnt"]

  prove:
    description: "Prove each property of the models with quint verify (Apalache). Apalache needs Java, which proto installs."
    command: "node"
    args: ["scripts/prove.ts"]
    inputs: ["*.qnt", "scripts/prove.ts", "/.prototools"]

  generate:
    description: "Write the data and the cases of the models into each core."
    command: "node"
    args: ["scripts/generate.ts"]
    inputs: ["*.qnt", "scripts/generate.ts"]
    options:
      runInCI: false
      cache: false

  check:
    description: "Check that the data and the cases in each core are the output of the models."
    command: "node"
    args: ["scripts/generate.ts", "--check"]
    deps: ["test", "prove"]
    inputs:
      - "*.qnt"
      - "scripts/generate.ts"
      - "/packages/core-ts/src/cli-output.generated.ts"
      - "/packages/core-effect/src/internal/output.generated.ts"
      - "/packages/core-rust/src/cli/output_generated.rs"
      - "/packages/core-ts/test/fixtures/cli-output-cases.json"
      - "/packages/core-effect/test/fixtures/cli-output-cases.json"
      - "/packages/core-rust/tests/fixtures/cli_output_cases.json"

  typecheck:
    description: "Type-check the scripts."
    command: "tsc"
    args: ["-p", "."]
    inputs: ["scripts/**/*.ts", "tsconfig.json", "/tsconfig.base.json"]
