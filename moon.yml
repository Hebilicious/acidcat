language: "typescript"
layer: "automation"

project:
  title: "AcidCat"
  description: "The specification, its schemas and examples, and the checks that span every package."

toolchains:
  default: ["javascript", "node", "pnpm"]

tasks:
  examples:
    description: "Render every Pkl catalog, write every catalog of the repository in canonical form, and write the GraphQL schema of the example."
    command: "node"
    args: ["scripts/render-catalogs.ts"]
    deps: ["example-aircon:schema"]
    inputs: ["**/*.pkl", "**/*.acidcat.json", "scripts/catalogs.ts", "scripts/render-catalogs.ts", "packages/catalog/typescript/src/**/*.ts"]
    toolchains: ["system"]
    options:
      runInCI: false
      cache: false

  check:
    description: "Check that every Pkl catalog is rendered, and that every catalog of the repository is canonical and conforms."
    command: "node"
    args: ["scripts/check-examples.ts"]
    inputs:
      - "**/*.pkl"
      - "**/*.acidcat.json"
      - "schemas/**/*.json"
      - "scripts/catalogs.ts"
      - "scripts/check-examples.ts"
      - "packages/catalog/typescript/src/**/*.ts"
      - "packages/cli/src/**/*.ts"

  lint:
    description: "Lint every TypeScript file with type information, check that no code turns the type checks off, and check that rustfmt formats every Rust crate."
    script: >-
      oxlint --deny-warnings . && node scripts/check-escapes.ts
      && cargo fmt --check --manifest-path packages/catalog/rust/Cargo.toml
      && cargo fmt --check --manifest-path packages/core-rust/Cargo.toml
      && cargo fmt --check --manifest-path examples/aircon/catalog/rust/Cargo.toml
      && cargo fmt --check --manifest-path examples/aircon/core-rust/Cargo.toml
    inputs:
      - "**/*.ts"
      - "**/tsconfig*.json"
      - ".oxlintrc.json"
      - "scripts/check-escapes.ts"
      - "**/*.rs"
      - "!**/target/**"
      - "**/Cargo.toml"

  commit-message:
    description: "Test the check that release-please can parse a squash commit."
    command: "node"
    args: ["--test", "scripts/commit-message.test.ts"]
    inputs: ["scripts/commit-message.ts", "scripts/commit-message.test.ts"]

  npm-packages:
    description: "Check that the npm packages are in publishing order: each package after the workspace packages that it depends on."
    command: "node"
    args: ["scripts/check-npm-packages.ts"]
    inputs: ["scripts/npm-packages.ts", "scripts/check-npm-packages.ts", "packages/**/package.json"]

  typecheck:
    description: "Type-check the scripts and the shared test support."
    command: "tsc"
    args: ["-p", "."]
    inputs: ["scripts/**/*.ts", "test-support/**/*.ts", "tsconfig.json", "tsconfig.base.json"]

  verify:
    description: "Every check: the catalogs, the lint, the toolchain, every catalog library, and every core."
    command: "noop"
    deps: ["check", "lint", "commit-message", "npm-packages", "typecheck", "model:check", "model:typecheck", "spec-ts:build", "mcp-handshake:build", "catalog-typescript:build", "cli:build", "core-effect:build", "core-ts:build", "spec-ts:test", "spec-ts:typecheck", "mcp-handshake:test", "mcp-handshake:typecheck", "cli:test", "cli:typecheck", "core-effect:test", "core-effect:typecheck", "core-ts:test", "core-ts:typecheck", "example-aircon:test", "example-aircon:typecheck", "catalog-typescript:test", "catalog-typescript:typecheck", "catalog-python:test", "catalog-python:package", "catalog-go:test", "catalog-rust:test", "catalog-rust:package", "core-rust:test", "core-rust:package", "catalog-pkl:test", "site:test", "site:typecheck", "site-framework:test", "site-framework:typecheck"]
