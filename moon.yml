language: "typescript"
layer: "automation"

project:
  title: "AcidCat"
  description: "The specification, its schemas and examples, and the checks that span every package."

toolchains:
  default: ["javascript", "node", "pnpm"]

tasks:
  examples:
    description: "Render every Pkl catalog, write every catalog of the repository in canonical form, and write the GraphQL schema of the example."
    command: "node"
    args: ["scripts/render-catalogs.ts"]
    deps: ["example-aircon:schema"]
    inputs: ["**/*.pkl", "**/*.acidcat.json", "scripts/catalogs.ts", "scripts/render-catalogs.ts", "packages/catalog/typescript/src/**/*.ts"]
    toolchains: ["system"]
    options:
      runInCI: false
      cache: false

  check:
    description: "Check that every Pkl catalog is rendered, and that every catalog of the repository is canonical and conforms."
    command: "node"
    args: ["scripts/check-examples.ts"]
    inputs:
      - "**/*.pkl"
      - "**/*.acidcat.json"
      - "schemas/**/*.json"
      - "scripts/catalogs.ts"
      - "scripts/check-examples.ts"
      - "packages/catalog/typescript/src/**/*.ts"
      - "packages/cli/src/**/*.ts"

  lint:
    description: "Lint every TypeScript file with type information, and check that no code turns the type checks off."
    script: "oxlint --deny-warnings . && node scripts/check-escapes.ts"
    inputs:
      - "**/*.ts"
      - "**/tsconfig*.json"
      - ".oxlintrc.json"
      - "scripts/check-escapes.ts"

  typecheck:
    description: "Type-check the scripts."
    command: "tsc"
    args: ["-p", "."]
    inputs: ["scripts/**/*.ts", "tsconfig.json", "tsconfig.base.json"]

  packages:
    description: "Pack the npm packages, install them into an empty project, and run both cores' conformance tests from it."
    command: "node"
    args: ["scripts/check-packages.ts"]
    deps: ["spec-ts:build", "catalog-typescript:build", "cli:build", "core-effect:build", "core-ts:build"]
    inputs: ["scripts/check-packages.ts", "scripts/npm-packages.ts", "examples/aircon/catalog/aircon.acidcat.json", "packages/*/test/**/*.ts", "packages/*/package.json", "packages/*/dist/**/*", "packages/catalog/typescript/package.json", "packages/catalog/typescript/dist/**/*", "tsconfig.base.json"]
    # The conformance tests start servers, command lines and Chromium. Two of them at the same time on a small CI runner
    # take longer than the time of a test, so the tasks that run them share the mutex "conform".
    options:
      mutex: "conform"

  verify:
    description: "Every check: the catalogs, the lint, the toolchain, every catalog library, and every core."
    command: "noop"
    deps: ["check", "lint", "typecheck", "packages", "spec-ts:test", "spec-ts:typecheck", "cli:test", "cli:typecheck", "core-effect:test", "core-effect:typecheck", "core-ts:test", "core-ts:typecheck", "example-aircon:test", "example-aircon:typecheck", "catalog-typescript:test", "catalog-typescript:typecheck", "catalog-python:test", "catalog-python:package", "catalog-go:test", "catalog-rust:test", "catalog-rust:package", "catalog-pkl:test", "core-kotlin:test", "core-kotlin:package", "appfunctions:test", "appfunctions:package", "example-aircon-kotlin:test"]
